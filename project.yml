name: RoonRemote
options:
  bundleIdPrefix: com.djehring
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: 2
  DEVELOPMENT_TEAM: 37A49A3WRU
  CODE_SIGN_STYLE: Automatic
  INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
targets:
  RoonRemote:
    type: application
    platform: iOS
    sources:
      - path: RoonRemote
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: RoonRemoteWatch
        embed: true
        codeSign: true
      - target: RoonRemoteWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote
        PRODUCT_NAME: House Remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: RoonRemote/RoonRemote.entitlements
    info:
      path: RoonRemote/Info.plist
      properties:
        CFBundleDisplayName: House Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleSpokenName: House Remote
        INAlternativeAppNames:
          - INAlternativeAppName: House Remote
        INIntentsSupported:
          - INPlayMediaIntent
        INSupportedMediaCategories:
          - INMediaCategoryRadio
          - INMediaCategoryMusic
          - INMediaCategoryGeneral
        NSUserActivityTypes:
          - com.djehring.roonremote.playMedia
        NSSiriUsageDescription: >-
          House Remote uses Siri so you can play, stop, skip, and change
          volume in a room.
        # A storyboard, not UILaunchScreen+named color. Appearance-aware
        # catalog colors resolve to white in the launch process, which is
        # the blank iPad frame before SwiftUI mounts.
        UILaunchStoryboardName: LaunchScreen
        NSLocalNetworkUsageDescription: >-
          House Remote finds the bridge on your Wi-Fi so it can
          control the rooms in your house.
        NSCameraUsageDescription: >-
          House Remote photographs album covers so the bridge can
          match them in your library.
        NSMicrophoneUsageDescription: >-
          House Remote records a short clip so the bridge can turn
          speech into an AI search.
        NSPhotoLibraryUsageDescription: >-
          House Remote reads a cover photo from your library so the
          bridge can match the album.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        NSBonjourServices:
          - _roon-web-stack._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RoonRemoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RoonRemoteWidgets
        excludes:
          - Info.plist
      - path: Shared/RoonNowPlayingAttributes.swift
      - path: Shared/NowPlayingLiveIntents.swift
      - path: Shared/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.widgets
        PRODUCT_NAME: RoonRemoteWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteWidgets/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: RoonRemoteWidgets/RoonRemoteWidgets.entitlements
    info:
      path: RoonRemoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: House Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RoonRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoonRemoteTests
      - path: Shared/ArtworkCache.swift
      - path: Shared/FindingServerGate.swift
      - path: RoonRemote/Layout.swift
      - path: RoonRemote/LibraryIndex.swift
      - path: RoonRemote/Models.swift
      - path: RoonRemote/LibraryDragItem.swift
      - path: RoonRemote/PlaybackAdjustment.swift
      - path: RoonRemote/QueueRouting.swift
      - path: RoonRemote/QueueTimeline.swift
      - path: RoonRemote/ZoneTrackSelection.swift
      - path: RoonRemote/API/RoonAPIModels.swift
      - path: RoonRemote/RoomPresentation.swift
      - path: RoonRemote/SearchSelection.swift
      - path: RoonRemote/Sidebar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.tests
        GENERATE_INFOPLIST_FILE: YES
  RoonRemoteIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: RoonRemoteIntents
        excludes:
          - Info.plist
      - path: Shared/PlayRequest.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.intents
        PRODUCT_NAME: RoonRemoteIntents
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteIntents/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: RoonRemoteIntents/RoonRemoteIntents.entitlements
    info:
      path: RoonRemoteIntents/Info.plist
      properties:
        CFBundleDisplayName: House Remote
        NSExtension:
          NSExtensionAttributes:
            IntentsSupported:
              - INPlayMediaIntent
            SupportedMediaCategories:
              - INMediaCategoryRadio
              - INMediaCategoryMusic
              - INMediaCategoryGeneral
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
  RoonRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: RoonRemoteWatch
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: RoonRemoteWatchWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.watchkitapp
        PRODUCT_NAME: Roon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteWatch/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: RoonRemoteWatch/RoonRemoteWatch.entitlements
    info:
      path: RoonRemoteWatch/Info.plist
      properties:
        CFBundleDisplayName: House Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.djehring.roonremote
        WKRunsIndependentlyOfCompanionApp: false
        WKSupportsLiveActivityLaunchAttributeTypes:
          - RoonNowPlayingAttributes
  RoonRemoteWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: RoonRemoteWatchWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.watchkitapp.widgets
        PRODUCT_NAME: RoonWatchWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteWatchWidgets/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: RoonRemoteWatchWidgets/RoonRemoteWatchWidgets.entitlements
    info:
      path: RoonRemoteWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: House Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RoonRemoteTV:
    type: application
    platform: tvOS
    sources:
      - path: RoonRemoteTV
        excludes:
          - Info.plist
      - path: Shared
        excludes:
          - WatchPayload.swift
      - path: RoonRemote/Models.swift
      - path: RoonRemote/MockStore.swift
      - path: RoonRemote/DemoStore.swift
      - path: RoonRemote/QueueTimeline.swift
      - path: RoonRemote/QueueRouting.swift
        type: file
      - path: RoonRemote/PlaybackAdjustment.swift
        type: file
      - path: RoonRemote/LibraryIndex.swift
        type: file
      - path: RoonRemote/ZoneTrackSelection.swift
        type: file
      - path: RoonRemote/SearchSelection.swift
        type: file
      - path: RoonRemote/API
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.tv
        PRODUCT_NAME: RoonRemoteTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteTV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_ON_DEMAND_RESOURCES: NO
    info:
      path: RoonRemoteTV/Info.plist
      properties:
        CFBundleDisplayName: House Remote TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          House Remote TV finds the bridge on your Wi-Fi so it can
          control the rooms in your house.
        NSBonjourServices:
          - _roon-web-stack._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  RoonRemote:
    build:
      targets:
        RoonRemote: all
        RoonRemoteWatch: all
    run:
      config: Debug
      executable: RoonRemote
    test:
      config: Debug
      targets:
        - RoonRemoteTests
    archive:
      config: Release
  RoonRemoteWatch:
    build:
      targets:
        RoonRemoteWatch: all
        RoonRemote: [running]
    run:
      config: Debug
      executable: RoonRemoteWatch
    archive:
      config: Release
  RoonRemoteTV:
    build:
      targets:
        RoonRemoteTV: all
    run:
      config: Debug
      executable: RoonRemoteTV
    archive:
      config: Release
