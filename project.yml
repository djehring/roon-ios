name: RoonRemote
options:
  bundleIdPrefix: com.djehring
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: 1
targets:
  RoonRemote:
    type: application
    platform: iOS
    sources:
      - path: RoonRemote
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: RoonRemoteWatch
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote
        PRODUCT_NAME: Roon Remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: RoonRemote/Info.plist
      properties:
        CFBundleDisplayName: Roon Remote
        CFBundleSpokenName: Roon
        INAlternativeAppNames:
          - INAlternativeAppName: Roon
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >-
          Roon Remote finds the bridge on your Wi-Fi so it can
          control the rooms in your house.
        NSCameraUsageDescription: >-
          Roon Remote photographs album covers so the bridge can
          match them in your library.
        NSMicrophoneUsageDescription: >-
          Roon Remote records a short clip so the bridge can turn
          speech into an AI search.
        NSPhotoLibraryUsageDescription: >-
          Roon Remote reads a cover photo from your library so the
          bridge can match the album.
        NSBonjourServices:
          - _roon-web-stack._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RoonRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoonRemoteTests
      - path: Shared/ArtworkCache.swift
      - path: RoonRemote/Layout.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  RoonRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: RoonRemoteWatch
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: RoonRemoteWatchWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.watchkitapp
        PRODUCT_NAME: Roon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteWatch/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: RoonRemoteWatch/RoonRemoteWatch.entitlements
    info:
      path: RoonRemoteWatch/Info.plist
      properties:
        CFBundleDisplayName: Roon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.djehring.roonremote
        WKRunsIndependentlyOfCompanionApp: false
  RoonRemoteWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: RoonRemoteWatchWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.watchkitapp.widgets
        PRODUCT_NAME: RoonWatchWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteWatchWidgets/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: RoonRemoteWatchWidgets/RoonRemoteWatchWidgets.entitlements
    info:
      path: RoonRemoteWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Roon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RoonRemoteTV:
    type: application
    platform: tvOS
    sources:
      - path: RoonRemoteTV
        excludes:
          - Info.plist
      - path: Shared
        excludes:
          - WatchPayload.swift
      - path: RoonRemote/Models.swift
      - path: RoonRemote/MockStore.swift
      - path: RoonRemote/API
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djehring.roonremote.tv
        PRODUCT_NAME: RoonRemoteTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RoonRemoteTV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_ON_DEMAND_RESOURCES: NO
        DEVELOPMENT_TEAM: 37A49A3WRU
        CODE_SIGN_STYLE: Automatic
    info:
      path: RoonRemoteTV/Info.plist
      properties:
        CFBundleDisplayName: Roon TV
        NSLocalNetworkUsageDescription: >-
          Roon finds the bridge on your Wi-Fi so it can
          control the rooms in your house.
        NSBonjourServices:
          - _roon-web-stack._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  RoonRemote:
    build:
      targets:
        RoonRemote: all
        RoonRemoteWatch: all
    run:
      config: Debug
      executable: RoonRemote
    test:
      config: Debug
      targets:
        - RoonRemoteTests
  RoonRemoteWatch:
    build:
      targets:
        RoonRemoteWatch: all
        RoonRemote: [running]
    run:
      config: Debug
      executable: RoonRemoteWatch
  RoonRemoteTV:
    build:
      targets:
        RoonRemoteTV: all
    run:
      config: Debug
      executable: RoonRemoteTV
